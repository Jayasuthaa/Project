<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 170, 220, 0.55), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(130, 180, 255, 0.45), transparent 30%),
        linear-gradient(135deg, #32145f 0%, #6f1d83 48%, #da4f91 100%);
    }

    .glow {
      position: absolute;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      filter: blur(22px);
      animation: drift 8s ease-in-out infinite alternate;
    }

    .card {
      position: relative;
      width: min(82vw, 620px);
      padding: 4.5rem 3rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 80px rgba(20, 5, 50, 0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 16vw, 10rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      background: linear-gradient(135deg, #ffffff 20%, #ffd6ef 55%, #bfe1ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 8px 40px rgba(255, 255, 255, 0.16);
    }

    p {
      margin: 1.4rem 0 0;
      font-family: Arial, sans-serif;
      font-size: clamp(0.85rem, 2vw, 1rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      opacity: 0.78;
    }

    @keyframes drift {
      from {
        transform: translate(-16%, -12%) scale(0.85);
      }
      to {
        transform: translate(20%, 18%) scale(1.12);
      }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="card">
    <h1>Hello</h1>
    <p>Welcome</p>
  </main>
</body>
</html>
